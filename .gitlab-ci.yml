stages:
  - audit
  - lint

default:
  image: node:24.12
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

audit:
  stage: audit
  script:
    - npm audit --audit-level=moderate

codestyle:
  stage: lint
  script:
    - npm run lint:ci -- --format gitlab
  artifacts:
    reports:
      codequality: gl-codequality.json

type-check:
  stage: lint
  script:
    - npm run type-check
