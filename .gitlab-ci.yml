stages:
  - lint
  - test
  - report
  - build
  - deploy

default:
  image: node:22.14.0

.node:
  cache:
    - key:
        files:
          - package-lock.json
      paths:
        - node_modules
  before_script:
    - npm ci

code-style:
  extends: .node
  stage: lint
  script:
    - npm run lint:ci

test-api:
  extends: .node
  stage: test
  script:
    - cp $ENV_FILE .env
    - npm test
  artifacts:
    when: always
    paths:
      - reports/allure-results

report:
  dependencies:
    - test-api
  stage: report
  image: registry.gitlab.com/freepad/qajs_2024_12/allure
  script:
    - allure generate reports/allure-results --clean --report-dir reports/allure-report
  artifacts:
    paths:
      - reports/allure-report

build:
  image: docker:20.10.16
  stage: build
  services:
    - docker:20.10.16-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE:latest -t $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG .
    - docker push $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

pages:
  stage: deploy
  image: alpine:latest
  dependencies:
    - report
  script:
    - mkdir -p public
    - cp -r reports/allure-report/* public/
  artifacts:
    paths:
      - public
